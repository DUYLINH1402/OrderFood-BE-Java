name: CI/CD Pipeline for Spring Boot

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set image name to lowercase để convert DUYLINH1402/foodorder-backend → duylinh1402/foodorder-backend
      # (Do Docker KHÔNG cho phép chữ hoa trong image name)
      - name: Set image name to lowercase
        id: image_name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          GHCR_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}
          DOCKER_HUB_IMAGE=${{ secrets.DOCKER_USERNAME }}/foodorder-backend

          docker build \
            -t ${DOCKER_HUB_IMAGE}:latest \
            -t ${GHCR_IMAGE}:latest \
            .

          # Push lên Docker Hub
          docker push ${DOCKER_HUB_IMAGE}:latest
          # Push lên GitHub Container Registry (hiển thị trong mục Packages)
          docker push ${GHCR_IMAGE}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Di chuyển vào đúng thư mục chứa docker-compose.yml
            cd ~/backend
            # Pull image mới nhất từ Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/foodorder-backend:latest
            # Restart service backend (Docker Compose sẽ tự nhận image mới)
            docker compose up -d backend
            # Dọn dẹp các image cũ (nếu có) để giải phóng dung lượng
            docker image prune -f